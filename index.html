<script>
const previewApi = (() => {
  const cities = ['Hong Kong', 'Shanghai', 'Beijing'].map((name, i) => ({city_id:i+1,name,country:'China'}));
  const airports = {HKG:[1,'Asia/Hong_Kong'],PVG:[2,'Asia/Shanghai'],SHA:[2,'Asia/Shanghai'],PEK:[3,'Asia/Shanghai']};
  const carriers = {ST:'SkyTrip Air',CW:'City Wings'};
  const flights = [
    [101,'ST101','HKG','SHA','23T01:00','23T03:00',580],
    [102,'CW102','HKG','PVG','23T03:00','23T05:00',650],
    [103,'ST103','HKG','PVG','23T05:00','23T07:00',720],
    [201,'ST201','HKG','PVG','09T01:00','09T03:00',600],
    [202,'CW202','PVG','HKG','11T04:00','11T06:00',500],
    [203,'CW203','HKG','PEK','24T02:00','24T05:00',800]
  ].map(([flight_id,flight_no,origin_airport,destination_airport,dep,arr,base]) => {
    const [origin,departure_zone] = airports[origin_airport];
    const [destination,arrival_zone] = airports[destination_airport];
    const departure_utc = '2026-11-'+dep+':00Z', arrival_utc = '2026-11-'+arr+':00Z';
    return {flight_id,flight_no,origin_airport,destination_airport,origin,destination,departure_zone,arrival_zone,
      departure_utc,arrival_utc,duration_minutes:(Date.parse(arrival_utc)-Date.parse(departure_utc))/60000,
      airline_name:carriers[flight_no.slice(0,2)],origin_city:cities[origin-1].name,
      destination_city:cities[destination-1].name,economy_reference_price_cny:base};
  });
  const users = {1:{name:'Alice Chen',user_id:1},2:{name:'Bob Li',user_id:2}};
  const trips = [
    [11,1,'Alice completed journey'],[12,1,'Alice upcoming Shanghai'],[13,1,'Alice empty draft'],
    [21,2,'Bob completed journey'],[22,2,'Bob upcoming journey']
  ].map(([trip_id,user_id,title]) => ({trip_id,user_id,title}));
  const bookings = [
    [1001,11,201,'economy',2,1080,'CONFIRMED',0.10],
    [1002,21,201,'business',1,1200,'CONFIRMED',1],
    [1003,11,202,'business',1,1000,'CONFIRMED',0],
    [1004,12,101,'economy',2,1044,'CONFIRMED',0.10],
    [1005,22,102,'economy',1,650,'FAILED',0],
    [1006,22,102,'business',1,1300,'PENDING',1],
    [1007,22,103,'economy',1,720,'PENDING',0],
    [1008,22,203,'business',3,4800,'CONFIRMED',1]
  ].map(([booking_id,trip_id,flight_id,seat_class,passengers,order_total_cny,booking_status,benefit]) => ({
    booking_id,trip_id,flight_id,seat_class,passengers,order_total_cny,booking_status,
    passenger_name:users[trips.find(t=>t.trip_id===trip_id).user_id].name,
    ...cabinBenefit(seat_class, benefit)
  }));
  const payments = bookings.filter(b=>b.booking_id!==1007).map(b => {
    const payment_status=b.booking_status==='CONFIRMED'?'SUCCESS':b.booking_status;
    return {booking_id:b.booking_id,payment_id:b.booking_id+4000,payment_status,
      method:[1003,1008].includes(b.booking_id)?'SIM_WALLET':'SIM_CARD',payment_amount_cny:b.order_total_cny,
      paid_at_utc:payment_status==='SUCCESS'?(b.booking_id<=1003?'2026-11-06':'2026-11-15')+'T08:10:00Z':null};
  });
  const reviews = [
    {review_id:9001,user_id:1,flight_id:201,rating:5,comment:'Smooth simulated journey.'},
    {review_id:9002,user_id:2,flight_id:201,rating:4,comment:null}
  ];
  let user=null, phase='present', nextTrip=23, nextBooking=1009, nextPayment=5009, nextReview=9003;
  const now=()=>phase==='present'?'2026-11-18T12:00:00Z':'2026-11-25T12:00:00Z';
  const getFlight=id=>flights.find(f=>f.flight_id===id);
  const getTrip=id=>trips.find(t=>t.trip_id===id && t.user_id===user?.user_id);
  const owned=b=>b && Boolean(getTrip(b.trip_id));
  const getPayment=id=>payments.find(p=>p.booking_id===id);
  const fail=message=>{throw new Error(message);};
  function cabinBenefit(cabin, value) {
    return cabin==='economy'?{discount_rate:value}:{lounge_access:value};
  }
  function summarizeTrip(t) {
    const items=bookings.filter(b=>b.trip_id===t.trip_id);
    const confirmed=items.filter(b=>b.booking_status==='CONFIRMED');
    const departures=confirmed.map(b=>getFlight(b.flight_id).departure_utc).sort();
    const arrivals=confirmed.map(b=>getFlight(b.flight_id).arrival_utc).sort();
    const pending=items.filter(b=>b.booking_status==='PENDING').length;
    return {...t,confirmed_booking_count:confirmed.length,pending_booking_count:pending,
      failed_booking_count:items.filter(b=>b.booking_status==='FAILED').length,
      first_confirmed_departure_utc:departures[0],last_confirmed_arrival_utc:arrivals.at(-1),
      confirmed_total_cny:confirmed.reduce((sum,b)=>sum+b.order_total_cny,0),
      is_completed:Boolean(arrivals.length && !pending && arrivals.at(-1)<=now())};
  }
  function createBooking(data) {
    const {trip_id,flight_id,seat_class,passengers}=data;
    const flight=getFlight(flight_id), name=String(data.passenger_name??'').trim();
    if(!getTrip(trip_id) || !flight || flight.departure_utc<=now()) fail('Choose an owned journey and a future departure.');
    if(!['economy','business'].includes(seat_class) || !Number.isInteger(passengers) || passengers<1 || passengers>9 || !name || name.length>100)
      fail('Check the passenger name, cabin and party size.');
    const quote=previewQuote(flight.economy_reference_price_cny,seat_class,passengers);
    if(data.quoted_total_cny!==undefined && Number(data.quoted_total_cny)!==quote.total) fail('The displayed quote does not match.');
    const booking={booking_id:nextBooking++,trip_id,flight_id,seat_class,passengers,passenger_name:name,
      order_total_cny:quote.total,booking_status:'PENDING',...cabinBenefit(seat_class,quote.benefit)};
    bookings.push(booking);
    return booking;
  }
  const canReview=flight=>flight && flight.arrival_utc<=now() &&
    bookings.some(b=>owned(b) && b.flight_id===flight.flight_id && b.booking_status==='CONFIRMED') &&
    !reviews.some(r=>r.user_id===user.user_id && r.flight_id===flight.flight_id);
  function search(params) {
    const start=params.get('date'), days=Number(params.get('days'));
    const end=new Date(Date.parse(start+'T00:00:00Z')+days*86400000).toISOString().slice(0,10);
    const selected=flights.filter(f=>{
      const local=new Intl.DateTimeFormat('en-CA',{timeZone:f.departure_zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(f.departure_utc));
      return f.origin===Number(params.get('origin')) && f.destination===Number(params.get('destination')) &&
        f.departure_utc>now() && local>=start && local<end;
    }).sort((a,b)=>a.economy_reference_price_cny-b.economy_reference_price_cny || a.departure_utc.localeCompare(b.departure_utc));
    return {flights:selected,carriers:[],day_count:days};
  }
  return async function request(path,body) {
    const {pathname,searchParams}=new URL(path,'https://preview.invalid');
    if(pathname==='/bootstrap') return {user,cities,csrf:'',clock:{phase,mode:'demo',now_utc:now(),suggested_date:'2026-11-23'}};
    if(pathname==='/login') {
      user=users[body.user_id];
      if(!user) fail('Select a sample traveler.');
      return {};
    }
    if(pathname==='/logout') {user=null;return {};}
    if(pathname==='/flights') return search(searchParams);
    const detail=pathname.match(/^\/flights\/(\d+)$/);
    if(detail) {
      const flight=getFlight(Number(detail[1]));
      if(!flight) fail('Departure unavailable.');
      const rows=reviews.filter(r=>r.flight_id===flight.flight_id).map(r=>({...r,reviewer_name:users[r.user_id].name}));
      return {flight:{...flight,review_count:rows.length,
        average_rating:rows.length?(rows.reduce((sum,r)=>sum+r.rating,0)/rows.length).toFixed(2):null},reviews:rows};
    }
    if(!user) fail('Select a sample traveler first.');
    if(pathname==='/demo/clock') {
      if(!['present','after_journeys'].includes(body.phase)) fail('Invalid demo time.');
      phase=body.phase;return {};
    }
    if(pathname==='/trips') {
      if(!body) return {trips:trips.filter(t=>getTrip(t.trip_id)).map(summarizeTrip)};
      const title=String(body.title??'').trim();
      if(!title || title.length>150) fail('Enter a journey title.');
      const trip={trip_id:nextTrip++,title,user_id:user.user_id};trips.push(trip);return trip;
    }
    const tripMatch=pathname.match(/^\/trips\/(\d+)$/);
    if(tripMatch) {
      const trip=getTrip(Number(tripMatch[1]));
      if(!trip) fail('Journey unavailable.');
      return {trip,bookings:bookings.filter(b=>b.trip_id===trip.trip_id).map(b=>({
        ...getFlight(b.flight_id),...b,included_in_confirmed_total:b.booking_status==='CONFIRMED'
      }))};
    }
    if(pathname==='/bookings') return createBooking(body);
    if(pathname==='/payments') {
      const items=bookings.filter(owned);
      return {
        pending:items.filter(b=>b.booking_status==='PENDING' && getFlight(b.flight_id).departure_utc>now()).map(b=>({
          ...b,title:getTrip(b.trip_id).title,flight_no:getFlight(b.flight_id).flight_no,
          amount_due_cny:b.order_total_cny,payment_id:getPayment(b.booking_id)?.payment_id
        })),
        history:items.filter(b=>getPayment(b.booking_id)).map(b=>({
          ...b,...getPayment(b.booking_id),flight_no:getFlight(b.flight_id).flight_no
        })).sort((a,b)=>b.payment_id-a.payment_id)
      };
    }
    const action=pathname.match(/^\/bookings\/(\d+)\/(pay|retry)$/);
    if(action) {
      const booking=bookings.find(b=>b.booking_id===Number(action[1]));
      if(!owned(booking)) fail('Booking unavailable.');
      if(action[2]==='retry') {
        if(booking.booking_status!=='FAILED') fail('Only failed bookings can be retried.');
        return createBooking(booking);
      }
      let payment=getPayment(booking.booking_id);
      if(payment && payment.payment_status!=='PENDING') return payment;
      if(booking.booking_status!=='PENDING' || getFlight(booking.flight_id).departure_utc<=now() ||
        !['SUCCESS','FAILED'].includes(body.outcome) || !['SIM_CARD','SIM_WALLET'].includes(body.method)) fail('Payment is unavailable.');
      if(!payment) {
        payment={booking_id:booking.booking_id,payment_id:nextPayment++,method:body.method,payment_amount_cny:booking.order_total_cny};
        payments.push(payment);
      }
      payment.payment_status=body.outcome;
      payment.paid_at_utc=body.outcome==='SUCCESS'?now():null;
      booking.booking_status=body.outcome==='SUCCESS'?'CONFIRMED':'FAILED';
      return payment;
    }
    if(pathname==='/review-eligible') return {flights:flights.filter(canReview)};
    if(pathname==='/reviews') {
      const comment=String(body.comment??'').trim();
      if(!canReview(getFlight(body.flight_id))) fail('This departure is unavailable for review.');
      if(!Number.isInteger(body.rating) || body.rating<1 || body.rating>5 || comment.length>1000) fail('Check your rating and comment.');
      const review={review_id:nextReview++,user_id:user.user_id,flight_id:body.flight_id,rating:body.rating,comment:comment||null};
      reviews.push(review);return review;
    }
    if(pathname==='/statistics') return {destinations:cities.map(city=>{
      const rows=bookings.filter(b=>b.booking_status==='CONFIRMED' && getFlight(b.flight_id).destination===city.city_id);
      return {destination_city:city.name,country:city.country,confirmed_booking_count:rows.length,
        passenger_count:rows.reduce((sum,b)=>sum+b.passengers,0),
        confirmed_order_total_cny:rows.reduce((sum,b)=>sum+b.order_total_cny,0)};
    })};
    fail('This action is unavailable in the preview.');
  };
})();

function previewQuote(base,cabin,count) {
  const economy=cabin==='economy';
  const unitCents=Math.round(base*(economy?90:200));
  return {unit:unitCents/100,total:unitCents*count/100,benefit:economy?0.10:1};
}

async function tripsPage(){const {trips}=await api('/trips');$('#main').innerHTML=pageHead('My journeys','See your journeys.','Your confirmed totals, booking states and journey dates.','<button class="primary" id="new-journey">+ New journey</button>')+(trips.length?`<div class="trip-grid">${trips.map(t=>{const life=t.is_completed?'completed':t.confirmed_booking_count?'upcoming':t.pending_booking_count?'PENDING':'draft',label=t.is_completed?'Completed':t.confirmed_booking_count?'Upcoming':t.pending_booking_count?'Awaiting payment':'No active bookings';return `<article class="trip-card"><div class="trip-top"><h3>${esc(t.title)}</h3>${badge(life,label)}</div><p class="trip-date">${t.first_confirmed_departure_utc?`${dateLabel(t.first_confirmed_departure_utc)} — ${dateLabel(t.last_confirmed_arrival_utc)} · UTC`:'Dates appear after a booking is confirmed'}</p><span class="total"><span class="currency">CNY</span>${money(t.confirmed_total_cny)}</span><p class="form-note">Confirmed order total</p><div class="trip-bottom"><span class="counts">${t.confirmed_booking_count} confirmed · ${t.pending_booking_count} pending · ${t.failed_booking_count} failed</span><button class="secondary" data-trip="${t.trip_id}">View journey</button></div></article>`}).join('')}</div>`:'<div class="empty"><h3>Your first journey starts here.</h3><p>Create a journey, then add a departure from Explore flights.</p></div>');$('#new-journey').onclick=newJourney;document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>openTrip(Number(b.dataset.trip)))}
function newJourney(){modal('Create a journey','<form id="trip-form" class="modal-form"><label class="field">Journey title<input name="title" required maxlength="150" placeholder="e.g. Shanghai weekend"></label><p class="form-note">You can start with an empty journey and add flights later.</p><div class="form-error" role="alert"></div><button class="primary" type="submit">Create journey</button></form>');$('#trip-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('/trips',{title:e.target.elements.title.value});closeModal();await navigate('trips');toast('Journey created')}catch(err){formError(err)}finally{b.disabled=false}}}
async function openTrip(id){try{const data=await api('/trips/'+id);modal(data.trip.title,data.bookings.length?`<div class="booking-list">${data.bookings.map(b=>`<article class="booking-item"><div class="booking-top"><div><h3>${esc(b.flight_no)} · ${esc(b.origin_airport)} → ${esc(b.destination_airport)}</h3><p>${dateLabel(b.departure_utc,b.departure_zone)} · ${dateLabel(b.departure_utc,b.departure_zone,true)} ${esc(b.departure_zone)}</p></div>${badge(b.booking_status)}</div><p>${esc(b.passenger_name)} · ${esc(b.seat_class)} · ${b.passengers} traveller${b.passengers===1?'':'s'}</p><p class="form-note">${b.seat_class==='economy'?'Economy discount: '+Math.round(b.discount_rate*100)+'%':'Lounge access: '+(b.lounge_access?'Included':'Not included')}</p><span class="booking-amount">CNY ${money(b.order_total_cny)}</span><span class="form-note"> · booking #${b.booking_id}${b.included_in_confirmed_total?' · included in confirmed total':''}</span><div class="booking-actions">${b.booking_status==='PENDING'?`<button class="primary" data-pay="${b.booking_id}" ${new Date(b.departure_utc)<=new Date(state.clock.now_utc)?'disabled':''}>Simulate payment</button>`:b.booking_status==='FAILED'?`<button class="secondary" data-retry="${b.booking_id}" ${new Date(b.departure_utc)<=new Date(state.clock.now_utc)?'disabled':''}>Create a fresh retry</button>`:''}</div></article>`).join('')}</div>`:'<div class="empty"><h3>A blank canvas for your next trip.</h3><p>Find a departure and add it to this journey.</p></div>');$('#modal-body').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>paymentForm(Number(b.dataset.pay),id));$('#modal-body').querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(`/bookings/${b.dataset.retry}/retry`,{});toast('A new booking was created for the retry.');await navigate('trips');await openTrip(id)}catch(err){toast(err.message);b.disabled=false}})}catch(err){toast(err.message)}}
async function paymentForm(bid,trip=null){try{const data=await api('/payments'),booking=data.pending.find(b=>b.booking_id===bid),existing=data.history.find(p=>p.booking_id===bid);if(!booking){toast('This booking is no longer available for payment.');return}modal('Simulated payment',`<p>${esc(booking.flight_no)} · booking #${bid}</p><div class="quote"><div><strong>CNY ${money(booking.amount_due_cny)}</strong><p>Fixed total for this booking</p></div>${badge('PENDING')}</div><form class="modal-form" id="payment-form"><label class="field">Simulated method<select name="method" ${existing?'disabled':''}><option value="SIM_CARD" ${existing?.method==='SIM_CARD'?'selected':''}>Demo card</option><option value="SIM_WALLET" ${existing?.method==='SIM_WALLET'?'selected':''}>Demo wallet</option></select></label><p class="form-note">Classroom simulation. No real payment is processed.${existing?' The existing payment attempt will be continued.':''}</p><div class="form-error" role="alert"></div><div class="modal-footer"><button class="danger" type="submit" value="FAILED">Simulate failure</button><button class="primary" type="submit" value="SUCCESS">Simulate success</button></div></form>`);$('#payment-form').onsubmit=async e=>{e.preventDefault();const form=e.target;form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await api(`/bookings/${bid}/pay`,{method:existing?.method||form.elements.method.value,outcome:e.submitter.value});closeModal();toast(result.payment_status==='SUCCESS'?'Payment successful. Booking confirmed.':'Payment failed. Retrying creates a new booking.');await navigate(state.view);if(trip)await openTrip(trip)}catch(err){formError(err);form.querySelectorAll('button').forEach(b=>b.disabled=false)}}}catch(err){toast(err.message)}}
async function paymentsPage(){const data=await api('/payments');$('#main').innerHTML=pageHead('Payments','A clear view of every attempt.','Each booking has at most one payment record. Failed attempts stay in your history.')+`<h2 class="queue-heading">Awaiting payment</h2><div class="queue-list">${data.pending.length?data.pending.map(b=>`<article class="booking-item"><div class="booking-top"><div><h3>${esc(b.title)}</h3><p>${esc(b.flight_no)} · booking #${b.booking_id} · ${b.passengers} traveller${b.passengers===1?'':'s'}</p></div><span class="booking-amount">CNY ${money(b.amount_due_cny)}</span></div><div class="booking-actions"><button class="primary" data-pay="${b.booking_id}">${b.payment_id?'Continue simulation':'Simulate payment'}</button></div></article>`).join(''):'<div class="empty"><h3>Nothing awaiting payment.</h3><p>New bookings will appear here.</p></div>'}</div><div class="section-heading"><h2>Payment history</h2></div>${data.history.length?`<div class="table-wrap"><table><thead><tr><th>Attempt</th><th>Flight / booking</th><th>Result</th><th>Booking state</th><th>Amount · CNY</th><th>Paid on · UTC</th></tr></thead><tbody>${data.history.map(p=>`<tr><td>#${p.payment_id}</td><td>${esc(p.flight_no)} / #${p.booking_id}</td><td>${badge(p.payment_status)}</td><td>${badge(p.booking_status)}</td><td class="money">${money(p.payment_amount_cny)}</td><td>${p.paid_at_utc?dateLabel(p.paid_at_utc):'Not paid'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><p>Your payment history is empty.</p></div>'}`;document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>paymentForm(Number(b.dataset.pay)))}
async function reviewsPage(){const {flights}=await api('/review-eligible');$('#main').innerHTML=pageHead('Reviews','Share the journey you made.','Review your confirmed departures after scheduled arrival. One review per flight and account.')+(flights.length?`<div class="review-list">${flights.map(f=>`<article class="review-card"><h3>${esc(f.flight_no)} · ${esc(f.origin_airport)} → ${esc(f.destination_airport)}</h3><p>${esc(f.airline_name)} · arrived ${dateLabel(f.arrival_utc)} UTC</p><button class="secondary" data-review="${f.flight_id}">Write a review</button></article>`).join('')}</div>`:'<div class="empty"><h3>No departures awaiting a review.</h3><p>Confirmed arrivals you have not reviewed will appear here. Already reviewed departures are excluded.</p></div>');document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewForm(Number(b.dataset.review)))}
function reviewForm(fid){modal('Your flight review',`<form id="review-form" class="modal-form"><label class="field">Rating<select name="rating"><option value="5">5 · Excellent</option><option value="4">4 · Good</option><option value="3">3 · Average</option><option value="2">2 · Below average</option><option value="1">1 · Poor</option></select></label><label class="field">Comment · optional<textarea name="comment" maxlength="1000" placeholder="What was the journey like?"></textarea></label><div class="form-error" role="alert"></div><button class="primary" type="submit">Publish review</button></form>`);$('#review-form').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{await api('/reviews',{flight_id:fid,rating:Number(f.elements.rating.value),comment:f.elements.comment.value});closeModal();toast('Review saved in this preview.');await navigate('reviews')}catch(err){formError(err);b.disabled=false}}}
async function insightsPage(){const {destinations}=await api('/statistics'),total=destinations.reduce((s,d)=>s+Number(d.confirmed_booking_count),0),people=destinations.reduce((s,d)=>s+Number(d.passenger_count),0),amount=destinations.reduce((s,d)=>s+Number(d.confirmed_order_total_cny),0),max=Math.max(1,...destinations.map(d=>Number(d.confirmed_booking_count)));$('#main').innerHTML=pageHead('Destination insights','Where journeys come together.','Confirmed bookings across all accounts. Passenger counts and whole-order amounts are shown separately.')+`<div class="metric-grid"><div class="metric"><small>Confirmed bookings</small><strong>${total}</strong><small>orders, not unique travellers</small></div><div class="metric"><small>Passenger count</small><strong>${people}</strong><small>sum of booking party sizes</small></div><div class="metric"><small>Confirmed totals · CNY</small><strong>${money(amount)}</strong><small>whole-order amounts</small></div></div><div class="table-wrap"><table><thead><tr><th>Destination</th><th>Country / region</th><th>Confirmed bookings</th><th>Passengers</th><th>Order totals · CNY</th></tr></thead><tbody>${destinations.map(d=>`<tr><td><strong>${esc(d.destination_city)}</strong></td><td>${esc(d.country)}</td><td>${d.confirmed_booking_count} &nbsp; <progress max="${max}" value="${d.confirmed_booking_count}" aria-label="${esc(d.destination_city)} confirmed bookings"></progress></td><td>${d.passenger_count}</td><td class="money">${money(d.confirmed_order_total_cny)}</td></tr>`).join('')}</tbody></table></div>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#modal-close').onclick=closeModal;$('#clock-phase').onchange=async e=>{try{await api('/demo/clock',{phase:e.target.value});await refresh();await navigate(state.view);toast('Simulation time updated. Stored flight times stay fixed.')}catch(err){toast(err.message)}};
refresh().then(()=>navigate('search')).catch(err=>$('#main').innerHTML=`<div class="inline-error">${esc(err.message)}</div>`);

</script>
</body></html>
